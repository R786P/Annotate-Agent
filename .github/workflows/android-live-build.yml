name: Android Live Screen Build

on:
  push:
    branches:
      - feature/android-live-screen
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Patch Kotlin build compatibility
        working-directory: android
        run: sed -i 's/LinearLayout.LayoutParams(-1, 0, 1f).apply { minHeight = 180 }/LinearLayout.LayoutParams(-1, 0, 1f)/' app/src/main/java/com/r786p/annotateagent/live/LiveScreenService.kt

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: annotate-agent-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
