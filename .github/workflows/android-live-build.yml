name: Android Live Screen Build

on:
  push:
    branches:
      - feature/android-live-screen
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Patch Kotlin build compatibility
        working-directory: android
        run: sed -i 's/LinearLayout.LayoutParams(-1, 0, 1f).apply { minHeight = 180 }/LinearLayout.LayoutParams(-1, 0, 1f)/' app/src/main/java/com/r786p/annotateagent/live/LiveScreenService.kt

      - name: Make panda bubble draggable and edge-hideable
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/r786p/annotateagent/live/LiveScreenService.kt')
          s = path.read_text()

          s = s.replace(
              'private var bubble: PandaBubbleView? = null',
              'private var bubble: PandaBubbleView? = null\n    private var bubbleParams: WindowManager.LayoutParams? = null'
          )

          old_show = '''    private fun showOverlay() {
          if (bubble != null) return
          windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
          bubble = PandaBubbleView(this).apply {
              setOnBubbleClickListener { togglePanel() }
              setOnMicClickListener { startVoiceInput() }
          }
          val params = WindowManager.LayoutParams(
              88, 88,
              if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
              PixelFormat.TRANSLUCENT
          ).apply { gravity = Gravity.CENTER_VERTICAL or Gravity.END; x = 12; y = 0 }
          try { windowManager?.addView(bubble, params) } catch (_: Exception) { stopSelf() }
      }
'''
          new_show = '''    private fun showOverlay() {
          if (bubble != null) return
          windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
          bubble = PandaBubbleView(this).apply {
              setOnBubbleClickListener { togglePanel() }
              setOnMicClickListener { startVoiceInput() }
              setOnDragListener { dx, dy -> moveBubble(dx, dy) }
              setOnEdgeHideListener { toLeft -> hideBubbleToEdge(toLeft) }
              setOnRestoreListener { restoreBubbleFromEdge() }
          }
          val dm = resources.displayMetrics
          val initialX = (dm.widthPixels - 100).coerceAtLeast(0)
          val initialY = ((dm.heightPixels - 88) / 2).coerceAtLeast(0)
          val params = WindowManager.LayoutParams(
              88, 88,
              if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
              PixelFormat.TRANSLUCENT
          ).apply { gravity = Gravity.TOP or Gravity.START; x = initialX; y = initialY }
          bubbleParams = params
          try { windowManager?.addView(bubble, params) } catch (_: Exception) { stopSelf() }
      }

      private fun moveBubble(dx: Float, dy: Float) {
          val params = bubbleParams ?: return
          val dm = resources.displayMetrics
          val maxX = (dm.widthPixels - 88).coerceAtLeast(0)
          val maxY = (dm.heightPixels - 88).coerceAtLeast(0)
          params.x = (params.x + dx.toInt()).coerceIn(0, maxX)
          params.y = (params.y + dy.toInt()).coerceIn(0, maxY)
          try { windowManager?.updateViewLayout(bubble, params) } catch (_: Exception) { }
      }

      private fun hideBubbleToEdge(toLeft: Boolean) {
          val params = bubbleParams ?: return
          val dm = resources.displayMetrics
          params.x = if (toLeft) -72 else dm.widthPixels - 16
          try { windowManager?.updateViewLayout(bubble, params) } catch (_: Exception) { }
      }

      private fun restoreBubbleFromEdge() {
          val params = bubbleParams ?: return
          val dm = resources.displayMetrics
          params.x = if (params.x < 0) 12 else (dm.widthPixels - 100).coerceAtLeast(0)
          try { windowManager?.updateViewLayout(bubble, params) } catch (_: Exception) { }
      }
'''
          if old_show not in s:
              raise SystemExit('showOverlay block not found')
          s = s.replace(old_show, new_show)

          s = s.replace(
              '        private var onMicClick: (() -> Unit)? = null\n        private var downX = 0f\n        private var downY = 0f',
              '        private var onMicClick: (() -> Unit)? = null\n        private var onDrag: ((Float, Float) -> Unit)? = null\n        private var onEdgeHide: ((Boolean) -> Unit)? = null\n        private var onRestore: (() -> Unit)? = null\n        private var downX = 0f\n        private var downY = 0f\n        private var lastX = 0f\n        private var lastY = 0f\n        private var dragging = false\n        private var edgeHidden = false'
          )

          s = s.replace(
              '        fun setOnMicClickListener(listener: () -> Unit) { onMicClick = listener }\n        fun setListening(value: Boolean) { listening = value; invalidate() }',
              '        fun setOnMicClickListener(listener: () -> Unit) { onMicClick = listener }\n        fun setOnDragListener(listener: (Float, Float) -> Unit) { onDrag = listener }\n        fun setOnEdgeHideListener(listener: (Boolean) -> Unit) { onEdgeHide = listener }\n        fun setOnRestoreListener(listener: () -> Unit) { onRestore = listener }\n        fun setListening(value: Boolean) { listening = value; invalidate() }'
          )

          old_touch = '''        override fun onTouchEvent(event: MotionEvent): Boolean {
              when (event.actionMasked) {
                  MotionEvent.ACTION_DOWN -> { downX = event.x; downY = event.y; return true }
                  MotionEvent.ACTION_UP -> {
                      val dx = event.x - downX; val dy = event.y - downY
                      if (dx * dx + dy * dy > 100) return true
                      val cx = width * 0.72f; val cy = height * 0.78f
                      val r = width * 0.20f
                      if ((event.x - cx) * (event.x - cx) + (event.y - cy) * (event.y - cy) <= r * r) onMicClick?.invoke()
                      else onBubbleClick?.invoke()
                      return true
                  }
              }
              return true
          }
'''
          new_touch = '''        override fun onTouchEvent(event: MotionEvent): Boolean {
              when (event.actionMasked) {
                  MotionEvent.ACTION_DOWN -> {
                      downX = event.rawX; downY = event.rawY
                      lastX = event.rawX; lastY = event.rawY
                      dragging = false
                      return true
                  }
                  MotionEvent.ACTION_MOVE -> {
                      if (edgeHidden) return true
                      val dx = event.rawX - lastX
                      val dy = event.rawY - lastY
                      if (dx * dx + dy * dy > 9f) dragging = true
                      if (dragging) onDrag?.invoke(dx, dy)
                      lastX = event.rawX; lastY = event.rawY
                      return true
                  }
                  MotionEvent.ACTION_UP -> {
                      if (edgeHidden) {
                          edgeHidden = false
                          onRestore?.invoke()
                          return true
                      }
                      val totalX = event.rawX - downX
                      val totalY = event.rawY - downY
                      if (dragging) {
                          if (kotlin.math.abs(totalX) > 150f && kotlin.math.abs(totalX) > kotlin.math.abs(totalY) * 1.3f) {
                              edgeHidden = true
                              onEdgeHide?.invoke(totalX < 0f)
                          }
                          return true
                      }
                      val cx = width * 0.72f; val cy = height * 0.78f
                      val r = width * 0.20f
                      if ((event.x - cx) * (event.x - cx) + (event.y - cy) * (event.y - cy) <= r * r) onMicClick?.invoke()
                      else onBubbleClick?.invoke()
                      return true
                  }
                  MotionEvent.ACTION_CANCEL -> { dragging = false; return true }
              }
              return true
          }
'''
          if old_touch not in s:
              raise SystemExit('touch block not found')
          s = s.replace(old_touch, new_touch)

          s = s.replace('        overlayView = null; bubble = null', '        overlayView = null; bubble = null; bubbleParams = null')
          path.write_text(s)
          PY

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: annotate-agent-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
