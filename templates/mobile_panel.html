<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panda Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121318;color:#f5f6fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.panel{padding:16px;border-radius:24px;background:linear-gradient(145deg,#1b1d25,#111217);border:1px solid #30333e;box-shadow:0 18px 45px #0008}.head{display:flex;align-items:center;gap:8px}.title{font-size:19px;font-weight:800;flex:1}.live{font-size:11px;color:#75e6a2}.reply{height:170px;overflow:auto;margin-top:12px;padding:13px;border-radius:16px;background:#20222b;color:#edf0f8;white-space:pre-wrap;font-size:14px;line-height:1.45}.input{width:100%;min-height:66px;resize:none;margin-top:10px;padding:12px;border-radius:14px;border:1px solid #393d49;background:#292c36;color:white;font-size:15px;outline:none}.tools,.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:0;border-radius:12px;padding:10px 6px;background:#303440;color:#fff;font-size:11px;font-weight:700}.send{background:#5b5bf6;font-size:14px}.close{background:#3a3c46;font-size:14px}.hint{text-align:center;color:#858b9c;font-size:10px;margin-top:7px}</style>
</head>
<body>
<div class="panel">
  <div class="head"><div class="title">🐼 Panda Assistant</div><div class="live">● LIVE</div></div>
  <div id="reply" class="reply">🟢 Live Screen active\n\nPanda ko bolo ya neeche message likho...</div>
  <textarea id="input" class="input" placeholder="Message likho ya Paste karo..."></textarea>
  <div class="tools">
    <button class="btn" onclick="copyReply()">📋 Copy</button>
    <button class="btn" onclick="pasteText()">📥 Paste</button>
    <button class="btn" onclick="NativeBridge.openFilePicker()">📎 Upload</button>
    <button class="btn" onclick="NativeBridge.voice()">🎙️ Voice</button>
  </div>
  <div class="actions">
    <button class="btn send" onclick="send()">➤ Send</button>
    <button class="btn close" onclick="NativeBridge.closePanel()">✕ Close</button>
  </div>
  <div class="hint">Copy/paste/upload/voice sab isi panel me</div>
</div>
<script>
function send(){const e=document.getElementById('input'),v=e.value.trim();if(v){NativeBridge.send(v);e.value='';}}
function copyReply(){NativeBridge.copy(document.getElementById('reply').innerText);}
function pasteText(){const v=NativeBridge.paste();if(v){document.getElementById('input').value+=v;}}
function setReply(v){document.getElementById('reply').innerText=v||'';document.getElementById('reply').scrollTop=999999;}
</script>
</body>
</html>
