<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annotation Assist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <button class="live-screen-btn" id="liveScreenBtn" type="button">🔴 Live Screen</button>
    <div class="sidebar-footer">
      {% if configured %}
        <span class="status ok">● API connected</span>
      {% else %}
        <span class="status err">● GEMINI_API_KEY missing</span>
      {% endif %}
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      🎬 Annotation Assist
      <span id="liveStatus" class="live-status">Offline</span>
    </div>

    <div id="liveScreenPanel" class="live-screen-panel hidden">
      <div class="live-screen-top">
        <span>🔴 LIVE SCREEN</span>
        <button type="button" id="stopLiveScreenBtn">Stop</button>
      </div>
      <video id="liveScreenPreview" autoplay muted playsinline></video>
      <div id="liveScreenStatus">Screen share start nahi hua.</div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-bot">
        <div class="bubble">
          👋 Video bhejo aur batao kya karna hai. Neeche wale ek hi chat bubble me text ya 🎙️ voice dono se baat kar sakte ho.
        </div>
      </div>
    </div>

    <form class="composer" id="composerForm">
      <input type="file" id="videoInput" accept="video/*" hidden>
      <button type="button" id="attachBtn" class="icon-btn" title="Video attach karo">📎</button>
      <span id="fileChip" class="file-chip hidden"></span>
      <div class="composer-bubble">
        <textarea id="textInput" placeholder="Message likho ya 🎙️ dabakar bolo..." rows="1"></textarea>
        <button type="button" id="voiceBtn" class="voice-btn" title="Voice input on/off" aria-label="Voice input">🎙️</button>
      </div>
      <button type="submit" id="sendBtn" class="send-btn" title="Send">➤</button>
    </form>
  </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
