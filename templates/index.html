<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annotation Assist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <div class="sidebar-footer">
      {% if configured %}
        <span class="status ok">● API connected</span>
      {% else %}
        <span class="status err">● GEMINI_API_KEY missing</span>
      {% endif %}
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">🎬 Annotation Assist</div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-bot">
        <div class="bubble">
          👋 Video bhejo aur batao kya karna hai (jaise "segments banao topic change pe"). Main video dekh ke draft segments bana dunga — timestamps ke saath.
        </div>
      </div>
    </div>

    <form class="composer" id="composerForm">
      <input type="file" id="videoInput" accept="video/*" hidden>
      <button type="button" id="attachBtn" class="icon-btn" title="Video attach karo">📎</button>
      <span id="fileChip" class="file-chip hidden"></span>
      <textarea id="textInput" placeholder="Instructions likho... (jaise: har topic change pe segment banao)" rows="1"></textarea>
      <button type="submit" id="sendBtn" class="send-btn">➤</button>
    </form>
  </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
